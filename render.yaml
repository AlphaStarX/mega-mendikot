# Render Blueprint — Mega Mendikot 5v5
# Docs: https://render.com/docs/blueprint-spec
# To deploy: push this repo to GitHub, then go to render.com → New → Blueprint
# and connect the repo. Render reads this file and creates the service.

services:
  - type: web
    name: mega-mendikot
    runtime: node
    plan: free
    buildCommand: "npm ci && npx prisma generate"
    startCommand: "npx prisma migrate deploy && node server/index.js"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.20.4
      - key: FILL_TIMER_MS
        value: 20000
      # Account database (Render managed Postgres injects DATABASE_URL automatically
      # when you attach it as an add-on; otherwise set it manually to point at your DB).
      - key: DATABASE_URL
        sync: false
      # Account auth — HS256 JWT signing secret.
      - key: JWT_SECRET
        generateValue: true
      # Team voice (LiveKit, §6.1). Self-host a LiveKit SFU (Docker + TURN) on a
      # separate host and set all three. Until set, voice no-ops and the game
      # plays exactly as without it.
      # - key: LIVEKIT_API_KEY
      #   sync: false
      # - key: LIVEKIT_API_SECRET
      #   sync: false
      # - key: LIVEKIT_URL
      #   sync: false  # e.g. wss://livekit.your-host.com
