<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cards test</title>
<style>
  body { margin:0; background:#030f08; color:#eee; font:14px/1.6 system-ui,sans-serif; }
  #out { white-space:pre-wrap; padding:16px; max-width:700px; }
  .btn { cursor:pointer; border:2px solid #f5c542; border-radius:8px; background:#f5c542; color:#000; font-weight:700; padding:10px 18px; font-size:15px; margin:12px 16px; }
</style>
</head>
<body>
  <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>this.textContent='✅ Copied!')">📋 Copy results</button>
  <div id="out">Running… (if this stays here, the script broke early — scroll down for the error)</div>

  <script>
    // Append a line to the visible output div. Safe even if the div is gone.
    function log(line){ const o=document.getElementById('out'); if(o) o.textContent += "\n" + line; }
    // Catch ANY error so it shows on screen instead of silently killing the page.
    window.onerror = function(msg, src, ln, col, err){
      log("\n*** SCRIPT ERROR ***\n" + msg + "\n" + (err && err.stack));
      return false;
    };
    try {
      log("=== CARD DIAGNOSTICS ===");
      log("VIEWPORT: " + window.innerWidth + "x" + window.innerHeight);
      log("step 1: DOM checks");

      // Minimal replica of the real game-screen DOM so we measure the REAL layout.
      const gs = document.createElement('section');
      gs.id = 'game-screen';
      gs.className = 'screen';
      gs.style.cssText = 'display:flex; flex-direction:column; justify-content:space-between; height:100vh; width:100vw; position:fixed; inset:0; padding:8px;';
      gs.innerHTML = `
        <header id="hud" style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1480px;margin:0 auto;padding:8px 16px;gap:12px;">
          <div class="score team-a" style="padding:6px 14px;min-height:54px;background:rgba(0,0,0,.25);"><div class="score-main" style="font-size:18px;">Team A <b style="font-size:26px;">0</b></div><div class="tricks-line" style="font-size:11px;">Tricks: 0</div></div>
          <div class="center-info" style="display:flex;gap:10px;"><div id="trump-info" style="padding:7px 16px;background:rgba(0,0,0,.25);border-radius:999px;">Trump <b>♠</b></div></div>
          <div class="score team-b" style="padding:6px 14px;min-height:54px;background:rgba(0,0,0,.25);"><div class="score-main" style="font-size:18px;">Team B <b style="font-size:26px;">0</b></div></div>
        </header>
        <div id="table-wrap" style="flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;">
          <div id="table" style="position:relative;width:min(94vw,1180px);height:min(60vh,620px);border-radius:50%;background:green;">
            <div id="center" style="position:absolute;inset:0;">
              <div id="played-cards" style="position:absolute;top:50%;left:50%;width:0;height:0;"></div>
            </div>
          </div>
        </div>
        <footer id="hand-wrap" style="width:100%;min-height:168px;flex-shrink:0;padding:8px;text-align:center;">HAND</footer>
      `;
      // Keep the real #app hidden, show our replica.
      const app = document.getElementById('app');
      if (app) app.style.display = 'none';
      document.body.appendChild(gs);
      log("step 1: game screen built OK");

      // Add 3 played cards (enough to test visibility) using the real positioning.
      log("step 2: render played cards");
      const host = document.getElementById('played-cards');
      const seats = [0, 5, 2];
      seats.forEach(seat => {
        const slot = (seat + 5) % 10;
        const angle = slot * 36;
        const radius = 115;
        const rad = (angle - 90) * Math.PI / 180;
        const dx = Math.cos(rad) * radius, dy = Math.sin(rad) * radius;
        const el = document.createElement('div');
        el.className = 'table-card';
        el.style.cssText = 'position:absolute;width:66px;height:94px;left:-33px;top:-47px;background:#fff;color:#000;border:3px solid #bbb;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;';
        el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        el.innerHTML = '<div style="font-size:28px;">A</div><div style="font-size:30px;">♠</div>';
        host.appendChild(el);
      });
      log("step 2: " + host.querySelectorAll('.table-card').length + " cards added");

      // Measure everything after a tick.
      setTimeout(() => {
        try {
          const table = document.getElementById('table').getBoundingClientRect();
          const wrap = document.getElementById('table-wrap').getBoundingClientRect();
          const hud = document.getElementById('hud').getBoundingClientRect();
          const hand = document.getElementById('hand-wrap').getBoundingClientRect();
          const card = host.querySelector('.table-card').getBoundingClientRect();
          const cardInsideTable = card.left >= table.left && card.right <= table.right && card.top >= table.top && card.bottom <= table.bottom;
          const cx = table.left + table.width/2, cy = table.top + table.height/2;
          const atCenter = document.elementFromPoint(cx, cy);

          log("");
          log("=== RESULTS ===");
          log("HUD:         " + Math.round(hud.width) + "x" + Math.round(hud.height) + " @top " + Math.round(hud.top) + " bottom " + Math.round(hud.bottom));
          log("TABLE-WRAP:  " + Math.round(wrap.width) + "x" + Math.round(wrap.height) + " @top " + Math.round(wrap.top) + " bottom " + Math.round(wrap.bottom));
          log("TABLE:       " + Math.round(table.width) + "x" + Math.round(table.height) + " @top " + Math.round(table.top) + " bottom " + Math.round(table.bottom));
          log("HAND-WRAP:   " + Math.round(hand.width) + "x" + Math.round(hand.height) + " @top " + Math.round(hand.top) + " bottom " + Math.round(hand.bottom));
          log("CARD[0]:     " + Math.round(card.width) + "x" + Math.round(card.height) + " @ " + Math.round(card.left) + "," + Math.round(card.top) + " bottom " + Math.round(card.bottom));
          log("CARD INSIDE TABLE? " + (cardInsideTable ? "YES" : "NO  <-- problem!"));
          log("ELEMENT AT CENTER: " + (atCenter ? (atCenter.id || atCenter.className || atCenter.tagName) : "none"));
          log("");
          log("BOTTOM OF TABLE = " + Math.round(table.bottom) + " | TOP OF HAND = " + Math.round(hand.top) + " (overlap if hand top < table bottom)");
          log("");
          log(">>> Click 'Copy results' at the top, then paste it back <<<");
        } catch (e) {
          log("MEASURE ERROR: " + e.message);
        }
      }, 500);

    } catch (e) {
      log("\n*** BUILD ERROR ***\n" + e.message + "\n" + e.stack);
    }
  </script>
</body>
</html>
